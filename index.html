<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept 3 Prototype — iPad</title>
<style>  .tile:hover{border-color:#b9b9b6}
  @keyframes ringfill{from{stroke-dasharray:0 100}}
  @keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}
  @keyframes shimmer{0%{background-position:-480px 0}100%{background-position:480px 0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ring-anim{animation:ringfill 1.1s cubic-bezier(.2,.8,.2,1) both}
  .pop{animation:pop .45s cubic-bezier(.2,.8,.2,1) both}
  .skel{background:linear-gradient(90deg,#ececeb 0,#f7f7f5 40%,#ececeb 80%);background-size:960px 100%;animation:shimmer 1.2s linear infinite;border-radius:8px}
  .spin{animation:spin .9s linear infinite}
  @media (prefers-reduced-motion:reduce){.ring-anim,.pop,.skel,.spin{animation:none}}</style>
<style>
  :root {
    --page: #e6e6e3; --bar: #ffffff; --ink: #1f1f1f; --muted: #6b6b69; --line: #d0d0cd; --pill: #f0f0ee; --pill-on: #1f1f1f; --pill-on-ink: #ffffff;
    --fw: 1180px; --fh: 844px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page: #161615; --bar: #222221; --ink: #f2f2f0; --muted: #a5a5a2; --line: #3a3a38; --pill: #2e2e2d; --pill-on: #f2f2f0; --pill-on-ink: #161615; }
  }
  :root[data-theme="dark"] { --page: #161615; --bar: #222221; --ink: #f2f2f0; --muted: #a5a5a2; --line: #3a3a38; --pill: #2e2e2d; --pill-on: #f2f2f0; --pill-on-ink: #161615; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--page); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
  .bar { position: fixed; inset: 0 0 auto 0; min-height: 60px; display: flex; align-items: center; gap: 16px; padding: 8px 16px; box-sizing: border-box;
         background: var(--bar); border-bottom: 1px solid var(--line); z-index: 10; overflow-x: auto; }
  .brand { display: flex; flex-direction: column; flex-shrink: 0; }
  .brand b { font-size: 14px; }
  .brand span { font-size: 11px; color: var(--muted); }
  .pills { display: flex; gap: 6px; flex-shrink: 0; }
  .pill { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--pill); color: var(--ink);
          font-family: inherit; font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .pill[aria-current="page"] { background: var(--pill-on); color: var(--pill-on-ink); border-color: var(--pill-on); }
  .spacer { flex: 1; }
  .ghost { min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-family: inherit; font-weight: 600; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .stage { position: fixed; inset: 60px 0 0 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .device { flex-shrink: 0; padding: 18px; background: #121212; border-radius: 40px; box-shadow: 0 30px 80px rgba(0,0,0,.28), inset 0 0 0 2px #2a2a2a; transform-origin: center center; }
  .frame { position: relative; width: var(--fw); height: var(--fh); overflow: hidden; border-radius: 22px; background: #f2f2f0; transform: translateZ(0); }
  .scroller { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; outline: none; }
  .frame a { color: #1f1f1f; text-decoration: none; }
  .frame .tile:hover { border-color: #b9b9b6; }
  .frame button, .frame input { font-family: inherit; }
  .frame :focus-visible { outline: 2px solid #1f1f1f; outline-offset: 2px; }
  .tip { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--page); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 20; }
  @media (max-width: 640px) { .brand span { display: none; } }
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><b>Ventia field app — Concept 3</b><span>iPad prototype · low-fi greyscale</span></div>
  <nav class="pills" aria-label="Jump to screen"><button type="button" class="pill" data-go="home">Home</button><button type="button" class="pill" data-go="jobs">My Jobs</button><button type="button" class="pill" data-go="licenses">Licenses &amp; Qualifications</button><button type="button" class="pill" data-go="wallet">Wallet</button></nav>
  <div class="spacer"></div>
  <button type="button" class="ghost" id="reset" title="Clear everything you have tapped (wallet adds, accepted jobs…)">Reset prototype</button>
</header>
<main class="stage" id="stage">
  <div class="device" id="device">
    <div class="frame"><div class="scroller" id="scroller" tabindex="-1" aria-live="off"></div></div>
  </div>
</main>
<div class="tip" id="tip" role="status" hidden></div>
<script>
const DEV = {"w": 1180, "h": 844, "bezel": 18};
const FILES = {"home": "V3-iPad", "jobs": "V3-Jobs-iPad", "licenses": "V3-Licenses-iPad", "wallet": "V3-Wallet-iPad"};
const TEMPLATES = {
  "home": "<div style=\"width:100%;min-height:calc(var(--fh) * 100 / 100);background:#f2f2f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#1f1f1f;display:flex;flex-direction:column;position:relative;\">\n\n  <sc-if value=\"{{aiOpen}}\"><div onClick=\"{{closeAi}}\" style=\"position:fixed;inset:0;z-index:15;background:rgba(20,20,20,.12);\"><\/div><\/sc-if>\n  <div style=\"position:relative;z-index:20;display:flex;align-items:center;gap:20px;padding:14px 40px;background:#fff;border-bottom:1px solid #d8d8d6;\">\n    <div style=\"display:flex;align-items:center;gap:12px;flex-shrink:0;\">\n      <div style=\"width:42px;height:42px;border-radius:10px;background:#2b2b2b;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;\">V<\/div>\n      <div>\n        <div style=\"font-size:11px;color:#6b6b69;letter-spacing:.06em;text-transform:uppercase;\">Thu, 8 Oct 2026<\/div>\n        <div style=\"font-size:17px;font-weight:700;color:#1f1f1f;\">Good morning, John<\/div>\n      <\/div>\n    <\/div>\n    <div style=\"position:relative;flex:1;min-width:260px;max-width:480px;\">\n      <div style=\"display:flex;align-items:center;gap:8px;height:48px;padding:0 6px 0 14px;border:1px solid #C7D7FB;border-radius:999px;background:#f7f9fe;box-sizing:border-box;\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"color:#2563EB;flex-shrink:0;\"><path d=\"M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z\"/><path d=\"M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z\"/><\/svg>\n        <input id=\"ai-search-ipad\" type=\"search\" aria-label=\"Ask a question about a manual, SOP or safety document\" placeholder=\"Ask about a manual, SOP or safety document…\" value=\"{{query}}\" onChange=\"{{handleQuery}}\" onClick=\"{{openAi}}\" onKeyDown=\"{{aiKey}}\" style=\"flex:1;min-width:0;height:44px;border:none;background:transparent;font-size:14px;color:#1f1f1f;outline:none;\">\n        <button type=\"button\" onClick=\"{{askAi}}\" style=\"min-height:36px;padding:0 14px;border-radius:999px;border:none;background:#2b2b2b;color:#fff;font-size:13px;font-weight:700;cursor:pointer;\">Ask<\/button>\n      <\/div>\n      <sc-if value=\"{{aiOpen}}\">\n        <div role=\"dialog\" aria-label=\"Ask Ventia AI about manuals, SOPs and safety documents\" style=\"position:absolute;top:calc(100% + 10px);left:0;width:580px;background:#fff;border:1px solid #d8d8d6;border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.18);padding:16px;display:flex;flex-direction:column;gap:12px;z-index:30;\">\n          <div style=\"display:flex;align-items:center;gap:10px;\">\n            <span style=\"width:30px;height:30px;border-radius:8px;background:#2563EB;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z\"/><path d=\"M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z\"/><\/svg><\/span>\n            <div style=\"flex:1;min-width:0;\"><div style=\"font-size:13px;font-weight:700;\">Ask Ventia AI<\/div><div style=\"font-size:11px;color:#6b6b69;\">Manuals · SOPs · Safety documents<\/div><\/div>\n            <sc-if value=\"{{hasAnswer}}\"><button type=\"button\" onClick=\"{{clearAi}}\" style=\"min-height:36px;padding:0 10px;border:none;background:none;font-size:12px;font-weight:700;text-decoration:underline;cursor:pointer;color:#1f1f1f;\">New question<\/button><\/sc-if>\n            <button type=\"button\" aria-label=\"Close AI assistant\" onClick=\"{{closeAi}}\" style=\"width:36px;height:36px;border:none;background:#ececeb;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#1f1f1f;cursor:pointer;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><line x1=\"5\" y1=\"5\" x2=\"19\" y2=\"19\"/><line x1=\"19\" y1=\"5\" x2=\"5\" y2=\"19\"/><\/svg><\/button>\n          <\/div>\n          <sc-if value=\"{{noAnswer}}\">\n            <div style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#6b6b69;\">Try asking<\/div>\n            <div style=\"display:flex;flex-direction:column;gap:6px;\"><button type=\"button\" onClick=\"{{ask_manual}}\" style=\"display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 12px;border:1px solid #d8d8d6;border-radius:10px;background:#fff;color:#1f1f1f;font-size:13px;font-weight:600;text-align:left;cursor:pointer;\"><span style=\"display:inline-flex;align-items:center;gap:4px;flex-shrink:0;padding:2px 7px;border-radius:999px;background:#ececeb;color:#3d3d3b;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;\"><svg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 4h10a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z\"/><path d=\"M8 20a4 4 0 0 1-4-4\"/><\/svg>Manual<\/span><span style=\"flex:1;\">How do I reset the pump controller after a power outage?<\/span><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"color:#6b6b69;\"><polyline points=\"9 18 15 12 9 6\"/><\/svg><\/button><button type=\"button\" onClick=\"{{ask_sop}}\" style=\"display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 12px;border:1px solid #d8d8d6;border-radius:10px;background:#fff;color:#1f1f1f;font-size:13px;font-weight:600;text-align:left;cursor:pointer;\"><span style=\"display:inline-flex;align-items:center;gap:4px;flex-shrink:0;padding:2px 7px;border-radius:999px;background:#ececeb;color:#3d3d3b;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;\"><svg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"5\" y=\"4\" width=\"14\" height=\"17\" rx=\"2\"/><path d=\"M9 2h6v4H9z\"/><path d=\"M9 11h6M9 15h4\"/><\/svg>SOP<\/span><span style=\"flex:1;\">What are the steps to isolate a switchboard?<\/span><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"color:#6b6b69;\"><polyline points=\"9 18 15 12 9 6\"/><\/svg><\/button><button type=\"button\" onClick=\"{{ask_ppe}}\" style=\"display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 12px;border:1px solid #d8d8d6;border-radius:10px;background:#fff;color:#1f1f1f;font-size:13px;font-weight:600;text-align:left;cursor:pointer;\"><span style=\"display:inline-flex;align-items:center;gap:4px;flex-shrink:0;padding:2px 7px;border-radius:999px;background:#ececeb;color:#3d3d3b;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;\"><svg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z\"/><\/svg>Safety<\/span><span style=\"flex:1;\">What PPE do I need for switchboard work?<\/span><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"color:#6b6b69;\"><polyline points=\"9 18 15 12 9 6\"/><\/svg><\/button><button type=\"button\" onClick=\"{{ask_swms}}\" style=\"display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 12px;border:1px solid #d8d8d6;border-radius:10px;background:#fff;color:#1f1f1f;font-size:13px;font-weight:600;text-align:left;cursor:pointer;\"><span style=\"display:inline-flex;align-items:center;gap:4px;flex-shrink:0;padding:2px 7px;border-radius:999px;background:#ececeb;color:#3d3d3b;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;\"><svg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z\"/><\/svg>Safety<\/span><span style=\"flex:1;\">Summarise the SWMS for my next job<\/span><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"color:#6b6b69;\"><polyline points=\"9 18 15 12 9 6\"/><\/svg><\/button><\/div>\n            <div style=\"font-size:12px;color:#6b6b69;line-height:1.45;\">Answers come from Ventia-approved equipment manuals, SOPs and safety documents — always with the source, so you can check it.<\/div>\n          <\/sc-if>\n          <sc-if value=\"{{aiThinking}}\">\n            <div role=\"status\" aria-label=\"Searching documents\" style=\"display:flex;flex-direction:column;gap:8px;\"><div style=\"font-size:12px;color:#6b6b69;\">Searching manuals, SOPs and safety documents for “{{query}}”<\/div>\n            <div class=\"skel\" style=\"height:12px;\"><\/div><div class=\"skel\" style=\"height:12px;width:85%;\"><\/div><div class=\"skel\" style=\"height:12px;width:60%;\"><\/div><\/div>\n          <\/sc-if>\n          <sc-if value=\"{{hasAnswer}}\">\n            <div style=\"font-size:12px;color:#6b6b69;\">“{{query}}”<\/div>\n            <sc-if value=\"{{ans_manual}}\"><div style=\"display:flex;flex-direction:column;gap:10px;\"><p style=\"margin:0;font-size:14px;line-height:1.5;color:#1f1f1f;\">From the pump station controller manual — after a power outage:<\/p><ol style=\"margin:0;padding-left:20px;font-size:13px;line-height:1.5;color:#1f1f1f;\"><li style=\"margin:0 0 4px;\">Confirm supply is restored and the main isolator is closed.<\/li><li style=\"margin:0 0 4px;\">Check the controller display for active faults and note any codes.<\/li><li style=\"margin:0 0 4px;\">Press and hold <strong>RESET<\/strong> until the fault light clears.<\/li><li style=\"margin:0 0 4px;\">Run the pump in <strong>Manual<\/strong> briefly and check rotation and pressure.<\/li><li style=\"margin:0 0 4px;\">Return the selector to <strong>Auto<\/strong> and confirm the alarm has cleared at the control room.<\/li><\/ol><div style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #d8d8d6;border-radius:10px;background:#f7f7f5;\"><span style=\"width:30px;height:30px;border-radius:8px;background:#fff;border:1px solid #d8d8d6;display:flex;align-items:center;justify-content:center;flex-shrink:0;\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 4h10a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z\"/><path d=\"M8 20a4 4 0 0 1-4-4\"/><\/svg><\/span><div style=\"flex:1;min-width:0;\"><div style=\"font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">Pump Station Controller — Operator Manual (sample)<\/div><div style=\"font-size:11px;color:#6b6b69;\">Manual · Section 6.2 · Restart after supply loss<\/div><\/div><a href=\"#\" style=\"display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:0 12px;border-radius:8px;background:#2b2b2b;color:#fff;font-size:12px;font-weight:700;white-space:nowrap;\">Open document<svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><polyline points=\"9 18 15 12 9 6\"/><\/svg><\/a><a href=\"#\" aria-label=\"Save Pump Station Controller — Operator Manual (sample) for offline use\" style=\"width:36px;height:36px;border-radius:8px;border:1px solid #d8d8d6;background:#fff;display:flex;align-items:center;justify-content:center;color:#1f1f1f;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 4v12\"/><polyline points=\"7 11 12 16 17 11\"/><path d=\"M5 20h14\"/><\/svg><\/a><\/div><\/div><\/sc-if><sc-if value=\"{{ans_sop}}\"><div style=\"display:flex;flex-direction:column;gap:10px;\"><p style=\"margin:0;font-size:14px;line-height:1.5;color:#1f1f1f;\">Electrical isolation SOP — key steps:<\/p><ol style=\"margin:0;padding-left:20px;font-size:13px;line-height:1.5;color:#1f1f1f;\"><li style=\"margin:0 0 4px;\">Identify the circuit and every source of supply, including back-feeds.<\/li><li style=\"margin:0 0 4px;\">Notify affected people and the site contact.<\/li><li style=\"margin:0 0 4px;\">Isolate, then <strong>lock and tag<\/strong> each isolation point with your personal lock.<\/li><li style=\"margin:0 0 4px;\"><strong>Test before you touch<\/strong> — prove your tester, test for dead, prove the tester again.<\/li><li style=\"margin:0 0 4px;\">Record the isolation on the permit before starting work.<\/li><\/ol><div style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #d8d8d6;border-radius:10px;background:#f7f7f5;\"><span style=\"width:30px;height:30px;border-radius:8px;background:#fff;border:1px solid #d8d8d6;display:flex;align-items:center;justify-content:center;flex-shrink:0;\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"5\" y=\"4\" width=\"14\" height=\"17\" rx=\"2\"/><path d=\"M9 2h6v4H9z\"/><path d=\"M9 11h6M9 15h4\"/><\/svg><\/span><div style=\"flex:1;min-width:0;\"><div style=\"font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">SOP-ELE-014 Electrical Isolation &amp; Lock-out (sample)<\/div><div style=\"font-size:11px;color:#6b6b69;\">SOP · Steps 3–9<\/div><\/div><a href=\"#\" style=\"display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:0 12px;border-radius:8px;background:#2b2b2b;color:#fff;font-size:12px;font-weight:700;white-space:nowrap;\">Open document<svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><polyline points=\"9 18 15 12 9 6\"/><\/svg><\/a><a href=\"#\" aria-label=\"Save SOP-ELE-014 Electrical Isolation &amp; Lock-out (sample) for offline use\" style=\"width:36px;height:36px;border-radius:8px;border:1px solid #d8d8d6;background:#fff;display:flex;align-items:center;justify-content:center;color:#1f1f1f;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 4v12\"/><polyline points=\"7 11 12 16 17 11\"/><path d=\"M5 20h14\"/><\/svg><\/a><\/div><\/div><\/sc-if><sc-if value=\"{{ans_ppe}}\"><div style=\"display:flex;flex-direction:column;gap:10px;\"><p style=\"margin:0;font-size:14px;line-height:1.5;color:#1f1f1f;\">For live-adjacent switchboard work the safety standard requires:<\/p><ol style=\"margin:0;padding-left:20px;font-size:13px;line-height:1.5;color:#1f1f1f;\"><li style=\"margin:0 0 4px;\">Arc-rated clothing and face shield matching the <strong>arc-flash label<\/strong> on the board.<\/li><li sty       undoJob: () => this.setState({ job: '', reason: '' }),
      refresh: () => {
        this.setState({ syncing: true });
        clearTimeout(this._syncTimer);
        this._syncTimer = setTimeout(() => this.setState({ syncing: false, synced: 'just now' }), 1400);
      },
    };
    keys.forEach((k) => {
      v['open_' + k] = visible[k] && !done[k];
      v['done_' + k] = visible[k] && done[k];
      v['tick_' + k] = () => this.setState({ ['d_' + k]: !s['d_' + k] });
    });
    Object.keys(reasons).forEach((k) => {
      v['reason' + k] = s.reason === k;
      v['pick' + k] = () => this.setState({ reason: k });
    });
    return v;
  }
}
    return Component;
  },
  "jobs": function () {
class Component extends DCLogic {

    ['new', 'today', 'week', 'done'].forEach((f) => {
      v['f_' + f] = s.filter === f;
      v['nf_' + f] = s.filter !== f;
      v['set_' + f] = () => this.setState({ filter: f });
    });
    return v;
  }
}
    return Component;
  },

      startAddSeniors: () => this.setState({ step: 'addIntro', addingType: 'Seniors Card or Seniors Business Discount Card', consent: false }),
      startAddVeterans: () => this.setState({ step: 'addIntro', addingType: 'Veterans Card – Victoria', consent: false }),

    Object.keys(names).forEach((k) => {

class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(patch) {
    const next = typeof patch === 'function' ? patch(this.state) : patch;
    this.state = Object.assign({}, this.state, next);
    App.requestRender(this);
  }
}

const BOOL_ATTRS = new Set(['checked', 'disabled', 'required', 'selected', 'hidden', 'readonly']);
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function look(vals, key) {
  if (key === 'true') return true;
  if (key === 'false') return false;
  return key.split('.').reduce((o, p) => (o == null ? undefined : o[p]), vals);
}
function renderTemplate(tpl, vals) {
  let h = tpl, prev;
  const scIf = /<sc-if value="\{\{([\w.]+)\}\}">((?:(?!<sc-if)[\s\S])*?)<\/sc-if>/g;
  do { prev = h; h = h.replace(scIf, (m, k, inner) => (look(vals, k) ? inner : '')); } while (h !== prev);
  h = h.replace(/\son(Click|Change|KeyDown)="\{\{([\w.]+)\}\}"/g, (m, ev, k) => ` data-dc-${ev.toLowerCase()}="${k}"`);
  h = h.replace(/\s([\w:-]+)="\{\{([\w.]+)\}\}"/g, (m, attr, k) => {
    const v = look(vals, k);
    if (BOOL_ATTRS.has(attr.toLowerCase())) return v ? ` ${attr}` : '';
    return v == null ? '' : ` ${attr}="${esc(v)}"`;
  });
  return h.replace(/\{\{([\w.]+)\}\}/g, (m, k) => { const v = look(vals, k); return v == null ? '' : esc(v); });
}

const App = {
  screen: 'home', inst: {}, vals: {},
  fileFor(screen) { return FILES[screen]; },
  screenFor(file) { return Object.keys(FILES).find((k) => FILES[k] === file); },
  instance(screen) {
    if (!this.inst[screen]) { const C = COMPONENTS[screen](); this.inst[screen] = new C({}); }
    return this.inst[screen];
  },
  requestRender(c) { if (c === this.inst[this.screen]) this.render(); },
  render(resetScroll) {
    const sc = this.scroller;
    const c = this.instance(this.screen);
    this.vals = c.renderVals() || {};
    const top = resetScroll ? 0 : sc.scrollTop;
    const ae = document.activeElement;
    const focusId = ae && sc.contains(ae) && ae.id ? ae.id : null;
    let sel = null;
    try { if (focusId && ae.selectionStart != null) sel = [ae.selectionStart, ae.selectionEnd]; } catch (e) {}
    // Entry animations should play only when an element first appears, not on every re-render.
    const animSel = '.pop, .ring-anim';
    const seen = new Set(resetScroll ? [] : [...sc.querySelectorAll(animSel)].map((el) => el.outerHTML.replace(/ style="animation: none;"/, '')));
    sc.innerHTML = renderTemplate(TEMPLATES[this.screen], this.vals);
    sc.querySelectorAll(animSel).forEach((el) => { if (seen.has(el.outerHTML)) el.style.animation = 'none'; });
    sc.scrollTop = top;
    if (focusId) {
      const el = document.getElementById(focusId);
      if (el) { el.focus({ preventScroll: true }); if (sel) { try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
    }
    document.querySelectorAll('[data-go]').forEach((b) => b.setAttribute('aria-current', b.dataset.go === this.screen ? 'page' : 'false'));
  },
  go(screen, push) {
    if (!TEMPLATES[screen]) return;
    this.screen = screen;
    if (push !== false && location.hash !== '#' + screen) history.pushState(null, '', '#' + screen);
    this.render(true);
    this.scroller.focus({ preventScroll: true });
  },
  reset() { this.inst = {}; this.render(true); },
  fit() {
    const stage = document.getElementById('stage');
    const dev = document.getElementById('device');
    const w = DEV.w + DEV.bezel * 2, h = DEV.h + DEV.bezel * 2;
    const s = Math.min(1, (stage.clientWidth - 32) / w, (stage.clientHeight - 32) / h);
    dev.style.transform = `scale(${Math.max(s, 0.2)})`;
  },
};

function init() {
  const sc = App.scroller = document.getElementById('scroller');
  sc.addEventListener('click', (e) => {
    const t = e.target.closest('[data-dc-click]');
    if (t && sc.contains(t)) {
      if (t.disabled) return;
      const fn = App.vals[t.dataset.dcClick];
      if (typeof fn === 'function') { e.preventDefault(); fn(e); }
      return;
    }
    const a = e.target.closest('a[href]');
    if (a && sc.contains(a)) {
      e.preventDefault();
      const m = (a.getAttribute('href') || '').match(/(V3-[\w-]+)\.dc\.html/);
      if (m) { const s = App.screenFor(m[1]); if (s) App.go(s); }
      else flash(a);
    }
  });
  const onChange = (e) => {
    const t = e.target.closest('[data-dc-change]');
    if (!t || !sc.contains(t)) return;
    const isToggle = t.type === 'checkbox' || t.type === 'radio';
    if ((e.type === 'input') === isToggle) return;
    const fn = App.vals[t.dataset.dcChange];
    if (typeof fn === 'function') fn(e);
  };
  sc.addEventListener('input', onChange);
  sc.addEventListener('keydown', (e) => {
    const t = e.target.closest('[data-dc-keydown]');
    if (!t || !sc.contains(t)) return;
    const fn = App.vals[t.dataset.dcKeydown];
    if (typeof fn === 'function') fn(e);
  });
  sc.addEventListener('change', onChange);
  document.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => App.go(b.dataset.go)));
  document.getElementById('reset').addEventListener('click', () => App.reset());
  window.addEventListener('popstate', () => App.go(location.hash.slice(1) || 'home', false));
  window.addEventListener('resize', () => App.fit());
  App.screen = TEMPLATES[location.hash.slice(1)] ? location.hash.slice(1) : 'home';
  App.render(true);
  App.fit();
}

function flash(el) {
  const tip = document.getElementById('tip');
  tip.textContent = 'Not built yet in this prototype';
  tip.hidden = false;
  clearTimeout(flash._t);
  flash._t = setTimeout(() => { tip.hidden = true; }, 1400);
}

document.addEventListener('DOMContentLoaded', init);

</script>
